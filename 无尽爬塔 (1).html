<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无尽爬塔 - 放置挂机</title>
<style>
:root{
--bg1:#0f172a; --bg2:#020617;
--panel:rgba(30,41,59,.6);
--panel-hover:rgba(51,65,85,.7);
--border:rgba(148,163,184,.15);
--border-hover:rgba(148,163,184,.3);
--gold:#fbbf24; --fire:#f87171; --cyan:#38bdf8;
--text:#f1f5f9; --muted:#94a3b8;
--green:#4ade80; --red:#ef4444;
--purple:#a78bfa; --pink:#f472b6;
--shadow:0 4px 24px rgba(0,0,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
color:var(--text);
background:
radial-gradient(ellipse 80% 50% at 50% -20%,rgba(56,189,248,.15),transparent),
radial-gradient(ellipse 60% 40% at 80% 100%,rgba(167,139,250,.12),transparent),
linear-gradient(180deg,var(--bg1),var(--bg2));
min-height:100vh;
}
#app{display:flex;flex-direction:column;height:100vh;max-width:1280px;margin:0 auto;padding:14px;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-radius:14px;background:var(--panel);border:1px solid var(--border);flex-wrap:wrap;gap:8px 18px;backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.brand{font-weight:800;letter-spacing:1px;font-size:18px;background:linear-gradient(135deg,var(--gold),var(--fire));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.brand .accent{color:var(--fire)}
.hud{display:flex;gap:20px;align-items:baseline;font-size:13px;color:var(--muted);flex-wrap:wrap}
.hud .val{color:var(--text);font-weight:700}
.hud .gold-val{color:var(--gold);font-weight:800;font-size:20px}
main{flex:1;display:grid;grid-template-columns:1fr 400px;gap:12px;min-height:0}
body.compact-info main{grid-template-columns:2fr 1fr}
.battle{position:relative;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;padding:14px;backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.floor-tag{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:5px 16px;border-radius:20px;background:rgba(15,23,42,.8);border:1px solid var(--border);font-size:12px;color:var(--muted);z-index:5;white-space:nowrap;backdrop-filter:blur(8px)}
.floor-tag b{color:var(--gold)}
.floor-tag .boss-tag{color:var(--fire);font-weight:800;margin-left:6px}
.fighters{flex:1;display:flex;align-items:center;justify-content:space-around;gap:10px;min-height:0;padding-top:36px}
.fighter{flex:1;max-width:240px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.avatar{width:96px;height:96px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;background:linear-gradient(160deg,rgba(56,189,248,.15),rgba(167,139,250,.1));border:2px solid var(--border);position:relative;transition:all .2s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.fighter.attacking .avatar{animation:attackShake .3s}
.fighter .avatar.mon-boss{border-color:var(--fire);box-shadow:0 0 30px rgba(248,113,113,.4);color:var(--fire)}
.fighter .avatar.mon-elite{border-color:var(--purple);box-shadow:0 0 24px rgba(167,139,250,.45);color:var(--purple)}
.fighter .avatar.mon-raging{border-color:var(--red);box-shadow:0 0 36px rgba(239,68,68,.6);color:var(--red);animation:ragePulse .5s infinite}
@keyframes ragePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.name{font-size:14px;font-weight:800}
.name.boss{color:var(--fire)}
.name.elite{color:var(--purple)}
.name.raging{color:var(--red);animation:rageText .5s infinite}
@keyframes rageText{0%,100%{opacity:1}50%{opacity:.6}}
.hp-wrap{width:100%;height:16px;border-radius:10px;background:rgba(0,0,0,.45);overflow:hidden;position:relative;box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.hp-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .15s;width:100%}
.hp-fill.boss{background:linear-gradient(90deg,var(--purple),var(--red))}
.hp-fill.elite{background:linear-gradient(90deg,#7c3aed,var(--purple))}
.hp-fill.raging{background:linear-gradient(90deg,#991b1b,var(--red));animation:rageBar .5s infinite}
@keyframes rageBar{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}
.hp-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.9)}
.vs{font-size:18px;font-weight:900;color:var(--muted);letter-spacing:2px;background:linear-gradient(135deg,var(--gold),var(--fire));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
@keyframes attackShake{0%{transform:translateX(0)}30%{transform:translateX(-5px)}60%{transform:translateX(4px)}100%{transform:translateX(0)}}
.dmg{position:absolute;font-weight:900;font-size:18px;color:var(--gold);pointer-events:none;animation:floatUp 1s ease-out forwards;text-shadow:0 0 10px rgba(251,191,36,.7);z-index:6}
.dmg.crit{color:var(--fire);font-size:26px}
.dmg.skill{color:var(--cyan);font-size:28px}
.dmg.mon{color:var(--red);font-size:15px}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-80px)}}
.battle-msg{text-align:center;font-size:12px;color:var(--muted);min-height:20px;padding-top:4px}
.battle-msg.warn{color:var(--fire);font-weight:700}
.battle-msg.ok{color:var(--green)}
.panel{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:14px;min-height:0;backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1 1 auto;min-width:60px;padding:12px 8px;text-align:center;cursor:pointer;color:var(--muted);font-size:12px;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;font-weight:600}
.tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan);background:rgba(56,189,248,.08);font-weight:700}
.tab-body{flex:1;overflow-y:auto;padding:14px;display:none}
.tab-body.active{display:block}
.card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--border);margin-bottom:8px;transition:all .2s}
.card:hover{background:var(--panel-hover);border-color:var(--border-hover)}
.card .info{flex:1;min-width:0}
.card .name{font-weight:700;font-size:13px}
.card .desc{color:var(--muted);font-size:11px;margin-top:3px}
.card .lvl{color:var(--cyan);font-size:12px;font-weight:700}
.buy-btn{padding:8px 14px;border-radius:10px;border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.12);color:var(--gold);font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap;text-align:center;transition:all .2s}
.buy-btn:hover{background:rgba(251,191,36,.25);border-color:rgba(251,191,36,.6);transform:translateY(-1px)}
.buy-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.buy-btn .cost{display:block;font-size:10px;opacity:.85}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--border);margin-bottom:8px;font-size:13px;transition:all .2s}
.stat-row:hover{background:var(--panel-hover);border-color:var(--border-hover)}
.stat-row .label{font-weight:600}
.stat-row .val{color:var(--gold);font-weight:800}
.stat-row .btns{display:flex;gap:6px}
.pt-btn{width:32px;height:32px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--cyan);font-weight:800;cursor:pointer;font-size:16px;transition:all .2s}
.pt-btn:hover{background:rgba(56,189,248,.15);border-color:var(--cyan)}
.pt-btn:disabled{opacity:.3;cursor:not-allowed}
.equip-slot{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--border);margin-bottom:8px;font-size:12px;transition:all .2s}
.equip-slot:hover{background:var(--panel-hover);border-color:var(--border-hover)}
.eq-name{font-weight:800}
.q0{color:#cbd5e1}.q1{color:var(--green)}.q2{color:var(--cyan)}.q3{color:var(--purple)}.q4{color:var(--gold)}.q5{color:var(--pink);text-shadow:0 0 10px rgba(244,114,182,.6)}.q6{color:var(--fire);text-shadow:0 0 12px rgba(248,113,113,.7)}
.ach{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--border);margin-bottom:6px;font-size:12px;transition:all .2s}
.ach:hover{background:var(--panel-hover)}
.ach .badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);color:var(--muted);flex-shrink:0;font-weight:800;font-size:12px}
.ach.done .badge{background:rgba(251,191,36,.2);color:var(--gold);box-shadow:0 0 12px rgba(251,191,36,.3)}
.ach.done .an{color:var(--gold)}
.big-btn{width:100%;padding:13px;border-radius:12px;border:1px solid rgba(248,113,113,.5);background:linear-gradient(180deg,rgba(248,113,113,.25),rgba(248,113,113,.08));color:var(--fire);font-weight:800;cursor:pointer;font-size:14px;margin:5px 0;transition:all .2s}
.big-btn:hover{background:linear-gradient(180deg,rgba(248,113,113,.35),rgba(248,113,113,.15));transform:translateY(-1px);box-shadow:0 4px 16px rgba(248,113,113,.2)}
.big-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.ghost-btn{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);cursor:pointer;font-size:12px;transition:all .2s}
.ghost-btn:hover{background:rgba(255,255,255,.1);border-color:var(--border-hover);transform:translateY(-1px)}
.ghost-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.danger-btn{padding:8px 14px;border-radius:10px;border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.1);color:var(--red);cursor:pointer;font-size:12px;transition:all .2s}
.danger-btn:hover{background:rgba(239,68,68,.2)}
select.farm-select{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:#1e293b;color:var(--text);font-size:12px;cursor:pointer;outline:none;transition:all .2s}
select.farm-select:hover{border-color:var(--border-hover)}
.speed-group{display:flex;gap:6px}
.speed-btn{padding:7px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--muted);cursor:pointer;font-size:12px;transition:all .2s}
.speed-btn:hover{color:var(--text);background:rgba(255,255,255,.1)}
.speed-btn.active{color:var(--cyan);border-color:var(--cyan);background:rgba(56,189,248,.15);font-weight:700;box-shadow:0 0 12px rgba(56,189,248,.2)}
.title-icon{font-size:32px}
.log{margin-top:10px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:12px}
.log summary{cursor:pointer;font-weight:700;color:var(--cyan)}
.log-item{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);line-height:1.7;color:var(--muted)}
#toast-box{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:90%;max-width:440px}
.toast{padding:10px 18px;border-radius:20px;background:rgba(15,23,42,.95);border:1px solid rgba(251,191,36,.4);color:var(--gold);font-size:12px;animation:toastIn .3s ease;text-align:center;backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1}}
#offlineModal{position:fixed;inset:0;background:rgba(2,6,23,.9);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(8px)}
#offlineModal.show{display:flex}
#confirmModal{position:fixed;inset:0;background:rgba(2,6,23,.9);display:none;align-items:center;justify-content:center;z-index:55;padding:20px;backdrop-filter:blur(8px)}
#confirmModal.show{display:flex}
#confirmModal .modal-card p{color:var(--text);font-size:14px;line-height:1.7;margin:8px 0;text-align:left}
#confirmModal .row{display:flex;gap:10px;justify-content:center;margin-top:16px}
.modal-card{background:#1e293b;border:1px solid rgba(251,191,36,.4);border-radius:18px;padding:30px;text-align:center;max-width:420px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.modal-card h2{color:var(--gold);margin-bottom:10px;letter-spacing:2px;font-size:20px}
.modal-card p{color:var(--muted);font-size:13px;margin:5px 0}
.modal-card .earn{font-size:30px;font-weight:800;color:var(--gold);margin:16px 0}
.modal-btn{margin-top:14px;padding:11px 32px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--fire));color:#1a0a00;font-weight:800;border:none;cursor:pointer;font-size:15px;transition:all .2s}
.modal-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(251,191,36,.3)}
@media(max-width:760px){
#app{padding:8px;gap:8px}
main{grid-template-columns:1fr;grid-template-rows:minmax(280px,40vh) 1fr;gap:8px}
.battle{padding:10px}
.avatar{width:68px;height:68px;font-size:28px;border-radius:18px}
.vs{font-size:14px}
.floor-tag{top:8px;font-size:11px;padding:4px 12px}
.fighters{gap:6px;padding-top:32px}
.name{font-size:12px}
.hp-wrap{height:14px}
.tab{padding:10px 6px;font-size:11px}
.tab-body{padding:10px}
.stat-row{padding:8px 10px;font-size:12px}
.card{padding:9px 10px}
.big-btn{padding:11px;font-size:13px}
.ghost-btn{padding:7px 10px;font-size:11px}
.buy-btn{padding:7px 10px;font-size:11px}
}
</style>
</head>
<body>
<div id="app">
<header>
<div class="brand"><span class="accent">▼</span> 无尽爬塔</div>
<div class="hud">
<span>第 <b class="val" id="hudFloor">1</b> 层</span>
<span class="gold-val" id="hudGold">0</span>
<span>等级 <b class="val" id="hudLevel">1</b></span>
<span>DPS <b class="val" id="hudDps">0</b></span>

</header>
<main>
<section class="battle" id="battle">
<div class="floor-tag">第 <b id="floorNum">1</b> 层<span class="boss-tag" id="bossTag"></span><button class="ghost-btn" id="quickPauseBtn" style="margin-left:8px;padding:2px 8px;font-size:11px">⏸️</button></div>
<div class="fighters">
<div class="fighter" id="playerF">
<div class="avatar" id="playerAvatar">勇</div>
<div class="name" id="playerNameEl">勇者</div>
<div class="hp-wrap"><div class="hp-fill" id="playerHpFill"></div><div class="hp-text" id="playerHpText"></div></div>
</div>
<div class="vs">VS</div>
<div class="fighter" id="monF">
<div class="avatar" id="monAvatar">魔</div>
<div class="name" id="monName">史莱姆</div>
<div class="hp-wrap"><div class="hp-fill" id="monHpFill"></div><div class="hp-text" id="monHpText"></div></div>
</div>
</div>
<div class="battle-msg" id="battleMsg">勇者踏入高塔，战斗自动进行</div>

<aside class="panel">
<nav class="tabs" id="tabs">
<div class="tab active" data-tab="attrs">属性</div>

<div class="tab" data-tab="talents">天赋</div>
<div class="tab" data-tab="titles">称号</div>
<div class="tab" data-tab="backpack">背包</div>
<div class="tab" data-tab="dungeon">副本</div>
<div class="tab" data-tab="arena">竞技场</div>
<div class="tab" data-tab="fish">钓鱼</div>
<div class="tab" data-tab="boss">BOSS</div>
<div class="tab" data-tab="shop">商城</div>
<div class="tab" data-tab="ach">成就</div>
<div class="tab" data-tab="settings">设置</div>
</nav>
<div class="tab-body active" id="tab-attrs"></div>
<div class="tab-body" id="tab-skills"></div>
<div class="tab-body" id="tab-equip"></div>
<div class="tab-body" id="tab-rebirth"></div>
<div class="tab-body" id="tab-talents"></div>
<div class="tab-body" id="tab-titles"></div>
<div class="tab-body" id="tab-backpack"></div>
<div class="tab-body" id="tab-dungeon"></div>
<div class="tab-body" id="tab-arena"></div>
<div class="tab-body" id="tab-fish"></div>
<div class="tab-body" id="tab-boss"></div>
<div class="tab-body" id="tab-shop"></div>
<div class="tab-body" id="tab-ach"></div>
<div class="tab-body" id="tab-settings"></div>
</aside>
</main>
</div>
<div id="toast-box"></div>
<div id="offlineModal">
<div class="modal-card">
<h2>欢迎归来</h2>
<p>你离开了 <b id="offlineTime">--</b></p>
<p>离线挂机收益已为你保留</p>
<div class="earn" id="offlineEarn">+0</div>
<button class="modal-btn" id="offlineCollect">收下</button>
</div>
</div>
<div id="confirmModal">
<div class="modal-card">
<p id="confirmText"></p>
<div class="row">
<button class="modal-btn" id="confirmOk">确定</button>
<button class="ghost-btn" id="confirmCancel">取消</button>
</div>
</div>
</div>
<script>
/* base64 polyfill：确保所有环境下存档编码/解码可用 */
(function(){
var B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=';
if(typeof btoa!=='function'){
  window.btoa=function(s){
    s=String(s); var o='', i=0;
    while(i<s.length){
      var c1=s.charCodeAt(i++)&0xff, c2=s.charCodeAt(i++)&0xff, c3=s.charCodeAt(i++)&0xff;
      var e1=c1>>2, e2=((c1&3)<<4)|(c2>>4), e3=isNaN(c2)?64:((c2&15)<<2)|(c3>>6), e4=isNaN(c3)?64:c3&63;
      o+=B64[e1]+B64[e2]+B64[e3]+B64[e4];
    }
    return o;
  };
}
if(typeof atob!=='function'){
  window.atob=function(s){
    s=String(s).replace(/[^A-Za-z0-9+/=]/g,''); var o='', i=0;
    while(i<s.length){
      var e1=B64.indexOf(s.charAt(i++)), e2=B64.indexOf(s.charAt(i++)), e3=B64.indexOf(s.charAt(i++)), e4=B64.indexOf(s.charAt(i++));
      var c1=(e1<<2)|(e2>>4), c2=((e2&15)<<4)|(e3>>2), c3=((e3&3)<<6)|e4;
      o+=String.fromCharCode(c1);
      if(e3!==64) o+=String.fromCharCode(c2);
      if(e4!==64) o+=String.fromCharCode(c3);
    }
    return o;
  };
}
})();
(function(){
'use strict';
/* ============ 常量 ============ */
const SAVE_KEY='idle-tower-save-v1';
const OFFLINE_CAP=8*3600*1000;
const ATK_INTERVAL=1000;
const MON_INTERVAL=1500;
const CRIT_MULT=2;
const SKILL_CD=8000;
/* v3.0 数值上限：防止溢出导致Infinity崩溃 */
const MAX_GOLD=1e300; // 金币上限
const MAX_TITLE=1e19; // v3.7.9 称号数量上限提高10000倍（山河共主/摸鱼达人等）
const MAX_MULT=1e150; // 乘数上限，防止乘法链溢出
function safeNum(n){ if(!isFinite(n)||n==null) return 0; if(n>MAX_GOLD) return MAX_GOLD; if(n<-MAX_GOLD) return -MAX_GOLD; return n; }
function safeMult(a,b){ const r=a*b; return isFinite(r)?r:MAX_MULT; }
function capGold(g){ return Math.min(g, MAX_GOLD); }
function capTitle(t){ return Math.min(t, MAX_TITLE); }
/* v3.0.2 签到溢出补偿：称号达上限后，溢出部分按 1称号:1交易点 转化 */
function signOverflowCompensation(gain){
const room=MAX_TITLE-state.titleCount;
if(room>=gain) return 0;
const overflow=gain-room;
state.tradePoints+=overflow; // 溢出称号转化为交易点
return overflow;
}
/* ============ v3.1 新系统常量 ============ */

function talentCritBonus(){ return 0.02*talentLv('crit'); } // 致命一击：暴击+2%/点
function talentDropMult(){ return 1+0.10*talentLv('lucky'); } // 幸运：掉率+10%/点
function totalRebirth(){ return state.rebirthPoints+(state.storedRebirth||0); } // 总转生之力（含背包存储，用于战力/获取/副本/服用上限）
function rebirthCombatMult(){ return 1+0.12*totalRebirth(); } // v3.0 战力：攻击/生命/防御 +12%/点（原10%）
function rebirthGainMult(){ return 1+0.05*totalRebirth(); } // 获取：金币/经验/装备掉率 +5%/点
function dungeonTowerMult(){ return 1+Math.floor(state.dungeonMax/50); } // 每战胜50层无尽塔，基础属性+100%（独立乘区，转生不重置）
function baseAtk(){ return 10+state.level*2.5; } // v3.0 攻击成长 2.5/级（原2）
function achievementMult(){ return 1+0.10*state.achievements.length; } // 每完成 1 个成就，全属性 +10%（独立乘区）

function skillMult(){ return Math.min(1e150,1+0.0105*state.skillTaken); } // v3.8.3 上限保护

function sweepTotal(maxF){ // 扫荡 = 从第 1 层到当前最高层的累计产出

}

if(state.bossChallenge.date!==today){ state.bossChallenge.date=today; state.bossChallenge.count=0; }

function startBossChallenge(){
if(bossChallengeCount()<=0){ toast('今日BOSS挑战次数已用完，明天再来'); return; }
if(!state.bossChallenge) state.bossChallenge={date:'',count:0,bestFloor:0};
state.bossChallenge.count++;
// BOSS属性 = 当前层怪物 × 10
const f=state.curFloor;
const bossHp=monsterHp(f)*10;
const bossAtk=monsterAtk(f)*10;
// 模拟战斗：计算玩家DPS和BOSS DPS
const playerDps=Math.max(1,atk());
const bossDps=Math.max(1,bossAtk-defVal());
const playerTime=maxHp()/bossDps;
const bossTime=bossHp/playerDps;
if(playerTime<bossTime){
// 玩家输了
toast('BOSS太强了！你被击败了，下次再来');
return;
}
// 玩家赢了，获得奖励
const goldReward=monsterGold(f)*100*goldMult();
const expReward=monsterExp(f)*50;
state.gold=capGold(state.gold+goldReward);
state.totalGold=capGold(state.totalGold+goldReward);
gainExp(expReward);
// 随机稀有道具
const r=Math.random();
let extra='';
if(r<0.1){ state.rebirthPoints+=5; extra='、转生之力+5'; }
else if(r<0.2){ state.tradePoints+=50; extra='、交易点+50'; }
else if(r<0.3){ state.speedrunTickets=(state.speedrunTickets||0)+1; extra='、速通券+1'; }
else if(r<0.4){ state.trialCoins=(state.trialCoins||0)+100; extra='、试炼币+100'; }
// 更新最高层
if(f>(state.bossChallenge.bestFloor||0)) state.bossChallenge.bestFloor=f;
save(); renderAll(); updateHUD();
toast('击败BOSS！获得金币+'+fmt(goldReward)+'、经验+'+fmt(expReward)+extra);
}

/* ============ 工具 ============ */
function fmt(n){
if(!isFinite(n)||n==null) return '∞';
if(n<0) return '-'+fmt(-n);
if(n<1000) return Math.floor(n).toString();
if(n>=1e48) return n.toExponential(2); // v3.8.3 超大数据（>1e48）用科学计数法
const units=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','UD','DD','TD','QaD','QiD','SxD','SpD','OcD','NoD','Vg']; // v3.8.3 扩展到1e66
const tier=Math.floor(Math.log10(n)/3);
if(tier-1>=units.length) return n.toExponential(2);
const scaled=n/Math.pow(10,tier*3);
return scaled.toFixed(scaled>=100?1:2)+units[tier-1];
}
function fmtTime(ms){
const s=Math.floor(ms/1000);
if(s<60) return s+' 秒';
const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
return h>0?h+' 小时 '+m+' 分钟':m+' 分钟';
}

/* 丹药消耗公式：从 taken 开始服用 n 颗的总消耗（每服用10次 cost+1），O(1) 数学计算避免大循环卡顿 */
function pillsNeeded(taken,n){
if(n<=0) return 0;
const q=Math.floor(taken/10), r=taken%10;
const k1=Math.min(n,10-r); // 先补齐到下一档
let cost=k1*(q+1);
const rest=n-k1;
if(rest>0){
const full=Math.floor(rest/10), rem=rest%10;
cost+=full*10*((q+2)+(q+1+full))/2; // 等差求和：档位 q+2 … q+1+full，每档 10 颗
cost+=rem*(q+1+full+1);
}
return Math.min(cost, MAX_GOLD); // v3.7.1 数值保护，避免 Infinity 导致崩溃
}
function maxTakeable(mode,pills){
const max=(mode==='skill'?skillMaxTaken():(mode==='pet'?petMaxTaken():pillMaxTaken()));
const taken=(mode==='skill'?state.skillTaken:(mode==='pet'?state.petTaken:state.pillTaken));
let lo=0, hi=max-taken, best=0;
while(lo<=hi){
const mid=Math.floor((lo+hi)/2);
if(pillsNeeded(taken,mid)<=pills){ best=mid; lo=mid+1; } else hi=mid-1;
}
return best;
}
function takeAll(mode){
const max=(mode==='skill'?skillMaxTaken():(mode==='pet'?petMaxTaken():pillMaxTaken()));
const taken=(mode==='skill'?state.skillTaken:(mode==='pet'?state.petTaken:state.pillTaken));
const pills=(mode==='skill'?state.skillPills:(mode==='pet'?state.petPills:state.pills));
const n=maxTakeable(mode,pills);
if(n===0){
if(taken>=max) toast('已达服用上限（'+max+' 颗）');
else toast(((mode==='skill')?'技能结晶':((mode==='pet')?'宠物结晶':'丹药'))+'不足，无法服用');
return;
}
const cost=Math.min(pillsNeeded(taken,n), pills); // v3.7.1 保护：消耗不超过持有量
if(mode==='skill'){ state.skillPills=Math.max(0,state.skillPills-cost); state.skillTaken+=n; }
else if(mode==='pet'){ state.petPills=Math.max(0,state.petPills-cost); state.petTaken+=n; }
else { state.pills=Math.max(0,state.pills-cost); state.pillTaken+=n; }
save(); renderDungeon(); updateHUD();
toast('一键吃满：服用 '+n+' 颗'+(mode==='skill'?'技能结晶（技能伤害 +'+(n*1.05).toFixed(2)+'%）':(mode==='pet'?'宠物结晶（全属性 +'+(n*1.05).toFixed(2)+'%）':'丹药（攻击 +'+(n*1.05).toFixed(2)+'%）'))+'（已服用 '+(taken+n)+' / '+max+' 颗）');
}

function oneClickUpgrade(){
let spent=0, upgraded=false;
while(true){
let best=null, bestCost=Infinity;
SKILLS.forEach(s=>{ const c=skillCost(s); if(c<bestCost){ bestCost=c; best=s; } });

state.gold-=bestCost; state.skills[best.id]++; spent+=bestCost; upgraded=true;
}
renderAll(); updateHUD();
toast(upgraded?'一键升级完成：消耗 '+fmt(spent)+' 金币升级技能':'金币不足，暂时无法升级');
}

/* v3.5 只保留稀有道具，移除丹药等一键吞服的 */
{key:'trialResetScrolls',name:'副本重置卷',stateKey:'trialResetScrolls'},

{key:'goldBags',name:'金币福袋',stateKey:'goldBags'},

{key:'statPotions',name:'属性药水',stateKey:'statPotions'},
];
function storeItem(key,ratio){
const item=STORABLE_ITEMS.find(i=>i.key===key);
if(!item) return;
const available=state[item.stateKey]||0;
if(available<1){ toast(item.name+'不足'); return; }
let amount;
if(ratio==='all') amount=available;
else amount=Math.floor(available/ratio);
if(amount<1){ toast('数量太少，无法存储'); return; }
state[item.stateKey]-=amount;
if(!state.storedItems) state.storedItems={};
state.storedItems[key]=(state.storedItems[key]||0)+amount;
save(); renderBackpack();
toast('已存储 '+item.name+' ×'+amount);
}
function withdrawItem(key,ratio){
const item=STORABLE_ITEMS.find(i=>i.key===key);
if(!item) return;
if(!state.storedItems) state.storedItems={};
const stored=state.storedItems[key]||0;
if(stored<1){ toast(item.name+'存储量不足'); return; }
let amount;
if(ratio==='all') amount=stored;
else amount=Math.floor(stored/ratio);
if(amount<1){ toast('数量太少，无法取出'); return; }
state.storedItems[key]-=amount;
state[item.stateKey]=(state[item.stateKey]||0)+amount;
save(); renderBackpack();
toast('已取出 '+item.name+' ×'+amount);
}

function useBaseScroll(n){ // v3.7.7 支持数量参数，n=1使用1张，n>=持有量时全部使用
if(!n) n=1;
if(state.baseScrolls<1){ toast('没有基础单'); return; }
n=Math.min(n, state.baseScrolls);
state.baseScrolls-=n; state.baseScrollsUsed+=n;
save(); renderBackpack(); updateHUD(); renderAttrs();
toast('使用基础单 ×'+n+'：全属性额外乘区 +'+(n*10)+'%（当前 ×'+baseScrollMult().toFixed(2)+'）');
}
/* 背包存储/取出转生之力：仅可选 1/10、1/5、1/3、1/2、全部。存入的转生之力仍提供战力/获取加成，但不可用于兑换交易点 */
function storeRebirth(frac){
const avail=state.rebirthPoints;
if(avail<1){ toast('没有可存入的转生之力'); return; }
const n=frac>=1?avail:Math.max(1,Math.floor(avail*frac));
if(n>avail){ toast('转生之力不足'); return; }
state.rebirthPoints-=n; state.storedRebirth=(state.storedRebirth||0)+n;
save(); renderBackpack(); renderShop(); updateHUD();
toast('已存入 '+n+' 点转生之力到背包（仍提供战力/获取加成，但不可兑换交易点）');
}
function withdrawRebirth(frac){
const stored=state.storedRebirth||0;
if(stored<1){ toast('背包中没有转生之力'); return; }
let n;
if(frac<0){ n=Math.min(Math.abs(frac), stored); } // v3.7.7 负数表示固定数量
else if(frac>=1){ n=stored; }
else { n=Math.max(1,Math.floor(stored*frac)); }
if(n>stored){ toast('背包中转生之力不足'); return; }
state.storedRebirth-=n; state.rebirthPoints+=n;
save(); renderBackpack(); renderShop(); updateHUD();
toast('已从背包取出 '+n+' 点转生之力（可用于兑换交易点）');
}
function openTrialGift(){ // 开 1 个 you的神秘礼包：1%副本重置卷 / 9.9%勋章 / 79.2%基础单 / 9.9%you认可
const r=Math.random();
if(r<0.01) state.trialResetScrolls=(state.trialResetScrolls||0)+1;
else if(r<0.109) state.medalCount=capTitle(state.medalCount+1);
else if(r<0.901) state.baseScrolls=capTitle(state.baseScrolls+1);
else state.youTitle=capTitle(state.youTitle+1);
}
/* v3.7.8 批量开礼包：使用概率统计+随机扰动，避免大量循环导致卡顿 */
function batchOpenTrialGift(n){
if(n<=0) return;
if(n<=200){ for(let i=0;i<n;i++) openTrialGift(); return; } // 小数量直接循环
// 大数量使用近似计算+随机扰动
const resetScrolls=Math.floor(n*0.01+Math.random()*Math.sqrt(n*0.01*0.99));
const medals=Math.floor(n*0.099+Math.random()*Math.sqrt(n*0.099*0.901));
const baseScrolls=Math.floor(n*0.792+Math.random()*Math.sqrt(n*0.792*0.208));
const youTitles=n-resetScrolls-medals-baseScrolls;
state.trialResetScrolls=(state.trialResetScrolls||0)+Math.max(0,resetScrolls);
state.medalCount=capTitle(state.medalCount+Math.max(0,medals));
state.baseScrolls=capTitle(state.baseScrolls+Math.max(0,baseScrolls));
state.youTitle=capTitle(state.youTitle+Math.max(0,youTitles));
}

state.trialFloor=1;
if(state.inDungeon&&state.dungeonMode==='trial') fightReset();
save(); renderDungeon(); updateHUD();
toast('试炼已重置！当前基础属性 ×'+trialResetMult().toFixed(0)+'（第 '+state.trialResetCount+' 次重置）');
}

document.querySelectorAll('#speedGroup .speed-btn').forEach(b=>{
b.onclick=()=>{ state.speed=parseInt(b.dataset.speed); renderSettings(); toast('战斗速率已设为 '+state.speed+'x'); };
});
document.getElementById('farmSel').onchange=e=>{ selectFarmLayer(parseInt(e.target.value)); };
/* v3.3 快速推进 */
const qab=document.getElementById('quickAdvanceBtn'); if(qab) qab.onclick=()=>quickAdvance(state.allTimeMax);
document.getElementById('genSaveCode').onclick=genSaveCode;
document.getElementById('copySaveCode').onclick=copySaveCode;
document.getElementById('pasteImportBtn').onclick=importFromCode;
document.getElementById('dlSave').onclick=downloadSave;
const nameEl=document.getElementById('nameInput');
const saveName=()=>{ const v=nameEl.value.trim().slice(0,12); if(v&&v!==state.playerName){ state.playerName=v; save(); updateBattle(); toast('玩家名已修改为 '+v); } };
nameEl.onchange=saveName; nameEl.onkeydown=e=>{ if(e.key==='Enter') nameEl.blur(); };
document.getElementById('compactInfoBtn').onclick=()=>{
state.compactInfo=!state.compactInfo;
document.body.classList.toggle('compact-info',state.compactInfo);
save(); renderSettings();
toast(state.compactInfo?'已切换：信息面板仅占屏幕 1/3':'已切换：标准信息面板');
};
document.getElementById('loadSaveBtn').onclick=()=>{ document.getElementById('saveFile').click(); };
document.getElementById('saveFile').onchange=e=>{
const f=e.target.files[0]; if(f) importSave(f);
e.target.value='';
};
document.getElementById('resetBtn').onclick=resetGame;
/* v3.7.6 暂停战斗和禁用动画 */
const pb=document.getElementById('pauseBtn'); if(pb) pb.onclick=()=>{ state.paused=!state.paused; save(); renderSettings(); toast(state.paused?'战斗已暂停':'战斗已继续'); };
const dab=document.getElementById('disableAnimBtn'); if(dab) dab.onclick=()=>{ state.disableAnim=!state.disableAnim; save(); renderSettings(); toast(state.disableAnim?'战斗动画已禁用（省资源）':'战斗动画已开启'); };
const vb=document.getElementById('veteranBtn'); if(vb) vb.onclick=claimVeteran;
}
function selectFarmLayer(l){
if(l<1) l=1;
state.curFloor=l;
fightReset();
renderAll(); updateHUD();
toast('已切换到第 '+l+' 层挂机');
}

function encodeSave(){
try{
const json=JSON.stringify(state);
const b64=window.btoa(unescape(encodeURIComponent(json)));
return 'IDLE:'+b64;
}catch(e){ return ''; }
}
function decodeSave(code){
try{
let s=code.trim();
if(s.startsWith('IDLE:')){
s=s.slice(5).replace(/\s+/g,'');
let json=decodeURIComponent(escape(window.atob(s)));
json=json.replace(/[\x00-\x1F]+$/,'').trim();
return JSON.parse(json);
}
return JSON.parse(s);
}catch(e){ return null; }
}
function genSaveCode(){
const code=encodeSave();
if(!code){ toast('生成存档码失败'); return; }
document.getElementById('saveCodeBox').value=code;
toast('存档码已生成（'+code.length+' 字符），全选复制后发送到另一台设备');
}
function copySaveCode(){

box.select(); box.setSelectionRange(0,999999);

document.execCommand('copy');
toast('存档码已复制到剪贴板');

try{ navigator.clipboard.writeText(box.value); toast('存档码已复制到剪贴板'); }
catch(e2){ toast('复制失败，请手动全选复制'); }

}
function importFromCode(){

const d=decodeSave(code);
if(!d||typeof d!=='object'){ toast('存档无效，请检查是否完整粘贴（支持存档码和老版本 JSON）'); return; }
myConfirm('导入存档将覆盖当前进度，确定吗？',ok=>{
if(!ok) return;
applySaveData(d);

}
function applySaveData(d){
const def=defaultState();
state=Object.assign(def,d);
state.saveVer=8;
state.skills=Object.assign(def.skills,d.skills||{});
state.equip=Object.assign(def.equip,d.equip||{});
state.equipLv=Object.assign({weapon:0,armor:0,charm:0,ring:0,helm:0},d.equipLv||{});
['weapon','armor','charm','ring','helm'].forEach(p=>{ const it=state.equip[p]; if(it&&it.lv) state.equipLv[p]=Math.max(state.equipLv[p]||0,it.lv); });
state.achievements=Array.isArray(d.achievements)?d.achievements:[];
if(typeof state.speed!=='number'||state.speed<1) state.speed=1;
/* v3.0 兼容：talentPoints 嵌套对象合并 */
if(!state.talentPoints||typeof state.talentPoints!=='object'){ state.talentPoints={available:0,spent:0,talents:{warrior:0,guardian:0,wealth:0,scholar:0,crit:0,lucky:0}}; }
else { state.talentPoints=Object.assign({available:0,spent:0,talents:{}},state.talentPoints); state.talentPoints.talents=Object.assign({warrior:0,guardian:0,wealth:0,scholar:0,crit:0,lucky:0},state.talentPoints.talents||{}); }
if(typeof state.eventsTriggered!=='number') state.eventsTriggered=0;
if(typeof state.eliteKills!=='number') state.eliteKills=0;
if(typeof state.dailyTasksDone!=='number') state.dailyTasksDone=0;
if(typeof state.rageKills!=='number') state.rageKills=0;
if(typeof state.killsToday!=='number') state.killsToday=0;
if(typeof state.dungeonKillsToday!=='number') state.dungeonKillsToday=0;
save(); fightReset(); renderAll(); updateHUD();
}
function downloadSave(){
try{
const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='无尽爬塔存档_'+Date.now()+'.json';
document.body.appendChild(a); a.click(); a.remove();
URL.revokeObjectURL(a.href);
toast('存档已下载');
}catch(e){ toast('下载失败'); }
}
function importSave(file){
const reader=new FileReader();
reader.onload=()=>{
try{
let text=reader.result.trim();
let d=null;
if(text.startsWith('IDLE:')||text.startsWith('IDLE%3A')){
d=decodeSave(text);
}else{
d=JSON.parse(text);
}
if(!d||typeof d!=='object'||d===null) throw new Error('bad');
myConfirm('导入存档将覆盖当前进度，确定吗？',ok=>{
if(!ok) return;
applySaveData(d);
toast('存档读取成功');
});
}catch(e){ toast('存档文件无效'); }
};
reader.readAsText(file);
}
function todayStr(){ return new Date().toDateString(); }
function signCap(){ return 2+(state.signExtra||0); } // 每日签到上限：基础 2 次 + 签到重置卡每 100 张 +1
function signDaily(){
const t=todayStr();
if(state.lastSign!==t){ state.lastSign=t; state.signCount=0; }
const cap=signCap();
if(state.signCount>=cap){ toast('今天已签到 '+cap+' 次，明天再来'); return; }
const gain=Math.floor((Math.floor(state.titleCount/5)+1)*slackerMult()*medalMult());
const overflow=signOverflowCompensation(gain);
state.titleCount=capTitle(state.titleCount+gain); state.signCount++; state.signTotal++;
updateDailyProgress('sign',1);
save();
renderTitles(); updateHUD();
toast('签到成功（今日第 '+state.signCount+' / '+cap+' 次）！获得 '+gain+' 个「山河共主」称号'+(overflow>0?'，溢出 '+overflow+' 个转化为 '+overflow+' 交易点':''));
}
function signDailyAll(){ // 一键签到：签到到今日上限

if(state.lastSign!==t){ state.lastSign=t; state.signCount=0; }
const cap=signCap();
if(state.signCount>=cap){ toast('今日已签到 '+cap+' 次，明天再来'); return; }
/* v3.7.7 山河共主满了之后不自动一键签到 */
if(state.titleCount>=MAX_TITLE){ toast('「山河共主」已达上限（'+fmt(MAX_TITLE)+'），无法继续获取，建议手动签到1次查看溢出补偿'); return; }
let n=0,total=0,totalOverflow=0;
while(state.signCount<cap&&n<100){
const gain=Math.floor((Math.floor(state.titleCount/5)+1)*slackerMult()*medalMult());
const overflow=signOverflowCompensation(gain);
totalOverflow+=overflow;
state.titleCount=capTitle(state.titleCount+gain); state.signCount++; state.signTotal++; n++; total+=gain;
}
save(); renderTitles(); updateHUD();
toast('一键签到 ×'+n+'：共获得 '+total+' 个「山河共主」称号'+(totalOverflow>0?'，溢出 '+totalOverflow+' 个转化为 '+totalOverflow+' 交易点':''));
}
function useSignCard(n){ // 签到重置卡：1张重置今日签到次数并自动签到；100张今日可签到次数+1

state.signResetCards-=n;
if(n>=100){
state.signExtra=(state.signExtra||0)+1;
toast('已消耗 100 张签到重置卡，今日可签到次数 +1（当前上限 '+signCap()+' 次）');
}else{
const t=todayStr();
if(state.lastSign!==t){ state.lastSign=t; state.signCount=0; }
state.signCount=0;
toast('已重置今日签到次数，自动签到中…');
signDailyAll(); // 使用后自动签到
return;
}
save(); renderTitles(); updateHUD();
}

/* ============ v3.2 试炼一键速通 ============ */
function trialSpeedrun(targetFloor){
if(targetFloor<1||targetFloor>trialMaxFloor()){ toast('目标层数无效（1-'+trialMaxFloor()+'）'); return; }
if(targetFloor>state.trialHighest){ toast('只能速通已通关的层数（最高 '+state.trialHighest+' 层），请先手动挑战'); return; }
if(state.speedrunTickets<1){ toast('速通券不足，可在试炼商店用试炼币购买'); return; }
state.speedrunTickets--;
// 计算从当前层到目标层的奖励
let totalGifts=0,totalCoins=0,totalTp=0,newTitles=[];
const startFloor=state.trialFloor;
for(let f=startFloor;f<targetFloor;f++){
const n=trialGiftMult();
totalGifts+=n;
const coinGain=Math.floor(5*(1+f*0.02)*medalMult()*trialConquerorMult());
totalCoins+=coinGain;
const milestone=TRIAL_MILESTONE_REWARD[f+1];
if(milestone&&state.trialMilestones.indexOf(f+1)===-1){
state.trialMilestones.push(f+1);
totalCoins+=milestone.coins;
totalTp+=milestone.tp;
if(milestone.title){
if(milestone.title==='试炼征服者'){ state.trialTitles.conqueror=true; newTitles.push('试炼征服者'); }
else if(milestone.title==='深渊行者'){ state.trialTitles.abyss=true; newTitles.push('深渊行者'); }
else if(milestone.title==='you的化身'){ state.trialTitles.avatar=true; newTitles.push('you的化身'); }
else if(milestone.title==='时空主宰'){ state.trialTitles.master=true; newTitles.push('时空主宰'); } // v3.8.0
else if(milestone.title==='you的终结者'){ state.trialTitles.terminator=true; newTitles.push('you的终结者'); } // v3.8.0
}
}
}
// 发放奖励（礼包批量开启，不卡顿）
batchOpenTrialGift(totalGifts); // v3.7.8 批量开礼包
state.totalGiftsOpened+=totalGifts; // v3.2 速通也更新礼包计数
state.trialCoins+=totalCoins;
state.tradePoints+=totalTp;
state.trialFloor=targetFloor;
state.trialMax=Math.max(state.trialMax,targetFloor);
state.trialHighest=Math.max(state.trialHighest,targetFloor);
// 重置战斗到目标层
if(state.inDungeon&&state.dungeonMode==='trial'){
fightReset();
fight.mhp=trialMonsterHp(targetFloor);
fight.monName='you·试炼者·'+targetFloor;
fight.php=maxHp();
}
save(); renderDungeon(); updateHUD(); checkAchievements();
let msg='速通成功！第'+startFloor+'→'+targetFloor+'层：you的神秘礼包 ×'+totalGifts+'、试炼币 +'+totalCoins;
if(totalTp>0) msg+='、交易点 +'+totalTp;
if(newTitles.length>0) msg+='，获得称号「'+newTitles.join('」「')+'」';
toast(msg);
}

function bindDungeonActions(view){

const ts=document.getElementById('trialScrollBtn'); if(ts) ts.onclick=useTrialResetScroll;
/* v3.2 速通按钮 */
const sb=document.getElementById('speedrunBtn'); if(sb) sb.onclick=()=>{
const input=document.getElementById('speedrunInput');
const target=input?parseInt(input.value)||1:1;
trialSpeedrun(target);
};

const tct=document.getElementById('tcShopTicket'); if(tct) tct.onclick=()=>trialCoinShop('ticket');
const tcp=document.getElementById('tcShopPotion'); if(tcp) tcp.onclick=()=>trialCoinShop('potion');

const tcpet=document.getElementById('tcShopPet'); if(tcpet) tcpet.onclick=()=>trialCoinShop('petPotion');
const tctp=document.getElementById('tcShopTp'); if(tctp) tctp.onclick=()=>trialCoinShop('tp');
const tcrp=document.getElementById('tcShopRp'); if(tcrp) tcrp.onclick=()=>trialCoinShop('rp');
const tcr=document.getElementById('tcShopReset'); if(tcr) tcr.onclick=()=>trialCoinShop('resetScroll');
return;
}
const en=document.getElementById('enterDunBtn-'+view); if(en) en.onclick=()=>enterDungeon(view);
const tk=document.getElementById('takeBtn-'+view); if(tk) tk.onclick=()=>takeOne(view);
const tka=document.getElementById('takeAllBtn-'+view); if(tka) tka.onclick=()=>takeAll(view);
const sw=document.getElementById('sweepBtn-'+view); if(sw) sw.onclick=()=>towerSweep(view,0);
const usw=document.getElementById('useSweepBtn-'+view); if(usw) usw.onclick=()=>{ if(state.sweepCards<1){ toast('无尽塔扫荡卡不足'); return; } state.sweepCards--; towerSweep(view,1); };
const uswa=document.getElementById('useSweepAllBtn-'+view); if(uswa) uswa.onclick=()=>{ if(state.sweepCards<1){ toast('无尽塔扫荡卡不足'); return; } const n=state.sweepCards; state.sweepCards=0; towerSweep(view,n); };
}

/* 批量概率模拟：大数额开包/抽奖用二项正态近似，避免逐次循环卡顿 */
function _gauss(){ let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function _binom(n,p){ if(n<=0||p<=0) return 0; if(p>=1) return n; return Math.max(0,Math.min(n,Math.round(n*p+Math.sqrt(n*p*(1-p))*_gauss()))); }
function rollPool(n,probs){ // probs 概率数组（和=1），输出各类计数数组，总和=n
const out=[]; let left=n, pre=0;
for(let i=0;i<probs.length-1;i++){
const denom=1-pre; const cond=denom>0?probs[i]/denom:0;
const c=_binom(left,Math.max(0,Math.min(1,cond)));
out.push(c); left-=c; pre+=probs[i];
}
out.push(Math.max(0,left)); return out;
}

/* ============ 欧皇礼包 ============ */
function luckyProbs(){ // 欧皇礼包概率：签到重置卡 / 无尽扫荡卡 / 差一点就得到了 / 野生狗奶
const reduce=Math.floor(state.almostCount/100)*0.000001; // 差一点称号每100个，降低欧皇礼包中差一点概率 1/1000000
let almost=Math.max(0.80,0.9985-reduce); // 差一点概率最低 80%
let sign=Math.min(0.10,0.001+(0.9985-almost)*2/3); // 签到卡最高 10%（原0.1%的100倍）
let sweep=Math.min(0.05,0.0005+(0.9985-almost)*1/3); // 扫荡卡最高 5%（原0.05%的100倍）
let dog=Math.max(0,1-almost-sign-sweep); // 剩余概率给野生狗奶
return [sign,sweep,almost,dog];
}

const playerTurns=Math.ceil(opp.hp/playerDmg);
const oppTurns=Math.ceil(php/oppDmg);
state.arenaUsed++;
if(playerTurns<=oppTurns){
// 玩家胜
const tp=ARENA_REWARD_TP+Math.floor(state.arenaWins*5);
state.arenaWins++;
state.arenaCoins+=ARENA_REWARD_COIN;

}else{

toast('竞技场失败...被 '+opp.name+' 击败，明天再来！');
}

+'<div class="stat-row"><div class="label">竞技场币</div><div class="val" style="color:var(--gold)">'+state.arenaCoins+' 枚</div></div>'
+'<button class="big-btn" id="arenaFightBtn" '+(remain<=0?'disabled':'')+'>'+(remain>0?'挑战对手（剩余 '+remain+' 次）':'今日已用完')+'</button>'
+'<div style="font-size:11px;color:var(--muted);margin:10px 0;line-height:1.7">对手根据你的战力动态生成（80%-130%），胜利获得交易点+竞技场币，连胜奖励递增。每日 '+ARENA_DAILY+' 次。</div>'
+'<div class="stat-row"><div class="label"><b>竞技场币商店</b></div></div>'
+'<div class="stat-row"><div class="label">丹药大礼包（各塔+10）</div><button class="ghost-btn" id="arenaBuyPotion">50 币</button></div>'
+'<div class="stat-row"><div class="label">山河共主 ×5</div><button class="ghost-btn" id="arenaBuyTitle">200 币</button></div>'
+'<div class="stat-row"><div class="label">摸鱼达人 ×1</div><button class="ghost-btn" id="arenaBuySlacker">500 币</button></div>'
+'<div class="stat-row"><div class="label">恢复1次挑战</div><button class="ghost-btn" id="arenaBuyReset">100 币</button></div>';
document.getElementById('arenaFightBtn').onclick=arenaFight;
document.getElementById('arenaBuyPotion').onclick=()=>arenaBuyItem('potion');
document.getElementById('arenaBuyTitle').onclick=()=>arenaBuyItem('title');
document.getElementById('arenaBuySlacker').onclick=()=>arenaBuyItem('slacker');
document.getElementById('arenaBuyReset').onclick=()=>arenaBuyItem('reset');
}
/* ============ v3.1 钓鱼系统 ============ */
function startFish(){
if(state.fishing){ toast('正在钓鱼中...'); return; }
state.fishing=true;
state.fishStart=Date.now();
save(); renderFish();
toast('开始钓鱼...等待上钩！');
}
function checkFish(){
if(!state.fishing) return;
if(Date.now()-state.fishStart>=FISH_TIME){
// 鱼上钩了
const totalW=FISH_TYPES.reduce((s,f)=>s+f.weight,0);
let r=Math.random()*totalW;
let caught=FISH_TYPES[0];
for(const f of FISH_TYPES){ r-=f.weight; if(r<=0){ caught=f; break; } }
state.fishCaught[caught.name]=(state.fishCaught[caught.name]||0)+1;
state.fishTotal++;
state.fishing=false;
const tpGain=caught.value;
state.tradePoints+=tpGain;
save(); renderFish(); updateHUD();
toast('钓到了【'+caught.rarity+'】'+caught.name+'！价值 '+tpGain+' 交易点');
}
}
function sellFish(name){
const cnt=state.fishCaught[name]||0;
if(cnt<1){ toast('没有这种鱼'); return; }
const fish=FISH_TYPES.find(f=>f.name===name);
if(!fish) return;
state.fishCaught[name]--;
state.tradePoints+=fish.value;
save(); renderFish(); updateHUD();
toast('出售 '+name+'，获得 '+fish.value+' 交易点');
}
function renderFish(){
const box=document.getElementById('tab-fish');
let fishHtml='';
let totalValue=0;
FISH_TYPES.forEach(f=>{
const cnt=state.fishCaught[f.name]||0;
totalValue+=cnt*f.value;
const color=f.rarity==='神话'?'var(--fire)':f.rarity==='传说'?'var(--purple,#b06bff)':f.rarity==='史诗'?'var(--gold)':f.rarity==='稀有'?'var(--cyan)':'var(--muted)';
fishHtml+='<div class="stat-row"><div class="label" style="color:'+color+'">['+f.rarity+'] '+f.name+'</div><div class="val">×'+cnt+' <button class="ghost-btn" style="margin-left:8px" onclick="sellFish(\''+f.name+'\')" '+(cnt<1?'disabled':'')+'>出售 +'+f.value+'</button></div></div>';
});
box.innerHTML=''
+'<div class="stat-row"><div class="label"><span class="title-icon">🎣</span> 休闲钓鱼</div><div class="val">累计 '+state.fishTotal+' 条</div></div>'
+'<div class="stat-row"><div class="label">背包鱼总价值</div><div class="val" style="color:var(--gold)">'+totalValue+' 交易点</div></div>'
+(state.fishing
?'<div style="text-align:center;padding:20px"><div style="font-size:40px">🎣</div><div style="color:var(--cyan);margin-top:8px">正在钓鱼中... '+Math.max(0,Math.ceil((FISH_TIME-(Date.now()-state.fishStart))/1000))+'秒后上钩</div></div>'
:'<button class="big-btn" id="startFishBtn">开始钓鱼（5秒后上钩）</button>')
+'<div style="font-size:11px;color:var(--muted);margin:10px 0;line-height:1.7">钓鱼是纯休闲玩法，不影响战斗。每次5秒，随机获得7种品质的鱼，鱼可出售换取交易点。神话级「you的鱼」价值2000交易点！</div>'
+'<div class="stat-row"><div class="label"><b>鱼获图鉴</b></div></div>'
+fishHtml;
const btn=document.getElementById('startFishBtn');
if(btn) btn.onclick=startFish;
}
/* ============ v3.1 老玩家补偿 ============ */
function claimVeteran(){
if(state.veteranClaimed){ toast('补偿已领取'); return; }
const bonus=veteranBonus();
state.tradePoints+=bonus.tp;
state.rebirthPoints+=bonus.rp;
if(bonus.title) state.titleCount=capTitle(state.titleCount+1);
state.veteranClaimed=true;
save(); renderSettings(); updateHUD();
toast('老玩家补偿已发放：'+bonus.tp+' 交易点、'+bonus.rp+' 转生之力'+(bonus.title?'、专属称号「'+bonus.title+'」':''));
}
function renderAll(){
renderAttrs(); renderSkills(); renderEquip(); renderRebirth(); renderTalents(); renderTitles(); renderBackpack(); renderDungeon(); renderArena(); renderFish(); renderBossChallenge(); renderShop(); renderAch(); renderSettings();
}
/* v3.6.1 只渲染当前激活的tab，避免切换时渲染全部页面造成卡顿 */
function renderCurrentTab(){
const activeTab=document.querySelector('.tab.active');
if(!activeTab) return;
const tabName=activeTab.dataset.tab;
const renderMap={
attrs:renderAttrs,skills:renderSkills,equip:renderEquip,rebirth:renderRebirth,
talents:renderTalents,titles:renderTitles,backpack:renderBackpack,dungeon:renderDungeon,
arena:renderArena,fish:renderFish,boss:renderBossChallenge,shop:renderShop,
ach:renderAch,settings:renderSettings
};
if(renderMap[tabName]) renderMap[tabName]();
}
/* ============ 初始化 ============ */
function init(){
load();
document.body.classList.toggle('compact-info',!!state.compactInfo);
fightReset();
renderAll(); updateHUD(); updateBattle();
bindConfirm();
document.getElementById('tabs').addEventListener('click',e=>{
const tab=e.target.closest('.tab'); if(!tab) return;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.querySelectorAll('.tab-body').forEach(b=>b.classList.remove('active'));
tab.classList.add('active');
document.getElementById('tab-'+tab.dataset.tab).classList.add('active');
renderCurrentTab(); // 只渲染当前tab，避免卡顿
});
/* v3.1.1 副本二级标签事件委托：一次绑定，innerHTML 重建也不丢失 */
document.getElementById('tab-dungeon').addEventListener('click',e=>{
const btn=e.target.closest('.dungeon-tab-btn'); if(!btn) return;
state.dungeonView=btn.dataset.mode; save(); renderDungeon();
});
/* v3.7.6 快速暂停按钮 */
const qpb=document.getElementById('quickPauseBtn'); if(qpb) qpb.onclick=()=>{ state.paused=!state.paused; qpb.textContent=state.paused?'▶️':'⏸️'; save(); toast(state.paused?'战斗已暂停':'战斗已继续'); };
handleOffline();
setInterval(tick,150); // v3.8.3 从100ms调整为150ms，超大数据时减少计算量
setInterval(updateBattle,400); // v3.8.3 从300ms调整为400ms，减少渲染次数
setInterval(updateHUD,1200); // v3.8.3 从800ms调整为1200ms，HUD不需要太频繁更新
setInterval(checkAchievements,8000); // v3.8.3 从5000ms调整为8000ms
setInterval(save,60000); // v3.8.3 从30000ms调整为60000ms，超大数据时大幅减少JSON序列化开销
window.addEventListener('beforeunload',save);
window.addEventListener('resize',()=>{ _battleRectCache=null; }); // v3.7.5 窗口大小变化时清除缓存，下次spawnDmg重新获取
}
init();
})();
</script>
